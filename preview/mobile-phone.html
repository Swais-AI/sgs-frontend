<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
  <div class="scene">
    <div class="hello">
      <div class="crest-chip"><img src="../public/assets/sgs-logo.png" alt="SGS"></div>
      <h1>SGS Senior<br>Secondary School</h1>
      <div class="loc"><span></span><strong>SHREERAMNAGAR</strong></div>
      <p>Your all-in-one AI-powered school portal — for students, teachers, parents, and administration.</p>
      <div class="badges"><span>🔒 Secure Portal</span><span>⚡ AI-Powered</span></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab">✉️&nbsp; Email</button>
        <button class="tab active">📱&nbsp; Phone</button>
      </div>
      <h2>Welcome Back</h2>
      <p class="sub">Sign in with your mobile number</p>

      <label>Select Role <span class="req">*</span></label>
      <div class="field select">
        <span class="left"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a6 6 0 0112 0v2"/></svg>Select your role</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <label>Mobile Number <span class="req">*</span></label>
      <div class="field">
        <span class="cc">🇮🇳 +91</span>
        <input placeholder="Enter mobile number" value="98765 43210">
      </div>

      <button class="btn">Send OTP
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>

      <div class="orrow">or</div>
      <p class="admin">Don't have an account. <strong>Contact SWAIS administrator.</strong></p>
    </div>
  </div>
</body></html>
